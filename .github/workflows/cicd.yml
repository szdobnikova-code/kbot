name: kbot CI/CD

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: make test

      - name: Set version
        id: version
        run: |
          VERSION="$(git describe --tags --abbrev=0)-$(git rev-parse --short HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            TARGETOS=linux
            TARGETARCH=amd64
            VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-linux-amd64

      - name: Update Helm image tag
        run: |
          sed -i "s|^  tag:.*|  tag: ${VERSION}|" helm/kbot/values.yaml

      - name: Commit Helm tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/kbot/values.yaml

          if git diff --cached --quiet; then
            echo "Helm tag is already up to date"
          else
            git commit -m "Update Helm image tag to ${VERSION} [skip ci]"
            git push origin HEAD:develop
          fi
